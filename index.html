<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0d0d" />
  <title>Chat Crypto</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            base: '#0d0d0d',
            surface: '#1a1a1a',
            surface2: '#1e1e1e',
            border1: '#2a2a2a',
            accent: '#6C63FF',
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        },
      },
    };
  </script>
  <style>
    :root { --vh: 1vh; }
    * { -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overscroll-behavior: none; }
    body {
      background: #0d0d0d;
      color: #e8e8e8;
      font-family: 'Inter', system-ui, sans-serif;
      margin: 0;
      overflow: hidden;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }

    /* ---- Chat Crypto logo: only the outer ring frame slowly shifts color; artwork stays still ---- */
    @keyframes ringSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes ringHue { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }
    .logo-mark { position: relative; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; }
    .logo-ring {
      position: absolute; inset: 0; border-radius: 50%;
      background: conic-gradient(from 0deg, #34D399, #4285F4, #8B5CF6, #ef4444, #FFD166, #34D399);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
      animation: ringSpin 22s linear infinite, ringHue 16s linear infinite;
    }
    .logo-mark.small .logo-ring { -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px)); mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px)); }
    .logo-img { width: 78%; height: 78%; border-radius: 50%; object-fit: cover; background: #0d0d0d; }

    @keyframes dotPulse { 0%,100% { opacity: .5; transform: scale(.85);} 50% { opacity: 1; transform: scale(1.15);} }
    .brand-dot { animation: dotPulse 1.8s ease-in-out infinite; }

    /* ---- Typing dots ---- */
    @keyframes typing { 0%,60%,100% { transform: translateY(0); opacity:.4;} 30% { transform: translateY(-5px); opacity:1;} }
    .tdot { width:7px;height:7px;border-radius:50%;background:#9aa0a6;display:inline-block;animation:typing 1.3s infinite; }
    .tdot:nth-child(2){animation-delay:.18s} .tdot:nth-child(3){animation-delay:.36s}

    /* ---- Streaming cursor ---- */
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .stream-cursor::after { content:'▋'; margin-left:2px; color:#6C63FF; animation:blink 1s step-end infinite; }

    /* ---- Message fade-in ---- */
    @keyframes fadeUp { from { opacity:0; transform: translateY(8px);} to { opacity:1; transform: translateY(0);} }
    .msg-in { animation: fadeUp .3s ease both; }

    /* ---- Mic listening pulse ---- */
    @keyframes micPulse { 0%{box-shadow:0 0 0 0 rgba(239,68,68,.55)} 70%{box-shadow:0 0 0 12px rgba(239,68,68,0)} 100%{box-shadow:0 0 0 0 rgba(239,68,68,0)} }
    .mic-listening { background:#ef4444 !important; animation: micPulse 1.4s infinite; }

    /* ---- Sidebar ---- */
    .sidebar { transform: translateX(-100%); transition: transform .28s cubic-bezier(.4,0,.2,1); }
    .sidebar.open { transform: translateX(0); }
    .overlay { opacity:0; pointer-events:none; transition:opacity .28s ease; }
    .overlay.show { opacity:1; pointer-events:auto; }

    /* ---- Markdown content ---- */
    .md p { margin: 0 0 8px; }
    .md p:last-child { margin-bottom: 0; }
    .md h1,.md h2,.md h3 { font-weight:600; margin:10px 0 6px; line-height:1.3; }
    .md h1{font-size:1.15rem} .md h2{font-size:1.08rem} .md h3{font-size:1rem}
    .md ul,.md ol { margin:6px 0 8px; padding-left:20px; }
    .md li { margin:3px 0; }
    .md code { background:#0f0f0f; border:1px solid #2a2a2a; padding:1px 5px; border-radius:5px; font-size:.85em; font-family:ui-monospace,monospace; }
    .md pre { background:#0f0f0f; border:1px solid #2a2a2a; padding:10px 12px; border-radius:10px; overflow-x:auto; margin:8px 0; }
    .md pre code { background:none; border:none; padding:0; }
    .md blockquote { border-left:3px solid #6C63FF; padding-left:10px; color:#b9b9c0; margin:8px 0; }
    .md a { color:#8ab4ff; text-decoration:underline; }
    .md strong { color:#fff; font-weight:600; }

    textarea { field-sizing: content; }
    .no-scrollbar::-webkit-scrollbar { display:none; }
    .chip-main { transition: background .15s, transform .1s; }
    .chip-main:active, .chip-arrow:active { transform: scale(.96); }

    /* ---- Coin picker bottom sheet ---- */
    .sheet { transform: translateY(100%); transition: transform .28s cubic-bezier(.4,0,.2,1); }
    .sheet.open { transform: translateY(0); }
    .coin-row:active { background:#242424; }
  </style>
</head>
<body>
  <div id="app" class="flex flex-col" style="height:100vh; height:calc(var(--vh, 1vh) * 100);">

    <!-- ===== Top Bar ===== -->
    <header class="flex items-center justify-between px-3 py-2.5 border-b border-border1/60 bg-base/95 backdrop-blur z-20">
      <div class="flex items-center gap-1">
        <button id="menuBtn" class="p-2 rounded-full hover:bg-surface active:scale-95 transition" aria-label="Menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e8e8e8" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div class="flex items-center gap-2 select-none">
          <div class="logo-mark small" style="width:26px;height:26px">
            <div class="logo-ring"></div>
            <img class="logo-img" alt="Chat Crypto">
          </div>
          <span class="text-[17px] font-semibold tracking-tight">Chat Crypto</span>
        </div>
      </div>
      <div class="flex items-center gap-0.5">
        <button id="speakerBtn" class="p-2 rounded-full hover:bg-surface active:scale-95 transition" aria-label="Toggle voice">
          <svg id="speakerOn" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#e8e8e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"/></svg>
          <svg id="speakerOff" class="hidden" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#7a7a7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m23 9-6 6M17 9l6 6"/></svg>
        </button>
        <button id="newChatBtn" class="p-2 rounded-full hover:bg-surface active:scale-95 transition" aria-label="New chat">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#e8e8e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
      </div>
    </header>

    <!-- ===== Messages / Welcome ===== -->
    <main id="scrollArea" class="flex-1 overflow-y-auto px-3 no-scrollbar">
      <!-- Welcome -->
      <div id="welcome" class="h-full flex flex-col items-center justify-center text-center px-6">
        <div class="logo-mark big mb-5" style="width:92px;height:92px">
          <div class="logo-ring"></div>
          <img class="logo-img" alt="Chat Crypto">
        </div>
        <h1 class="text-2xl font-semibold mb-2">Hello! I'm Chat Crypto</h1>
        <p class="text-[15px] text-[#9aa0a6] max-w-xs leading-relaxed mb-7">Your AI crypto analyst — live prices, chart reads &amp; market insight. Ask me anything, in any language.</p>
        <div id="chips" class="flex flex-wrap justify-center gap-2 max-w-sm">
          <div class="chip-group flex items-stretch rounded-2xl bg-surface border border-border1 overflow-hidden">
            <button class="chip-main px-3.5 py-2 text-sm hover:bg-surface2" data-chip="analyze">Analyze BTC 📊</button>
            <button class="chip-arrow px-2 py-2 border-l border-border1 hover:bg-surface2" data-chip="analyze" aria-label="Choose a coin">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9aa0a6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
          </div>
          <div class="chip-group flex items-stretch rounded-2xl bg-surface border border-border1 overflow-hidden">
            <button class="chip-main px-3.5 py-2 text-sm hover:bg-surface2" data-chip="gainers">Top Gainers Today 🚀</button>
            <button class="chip-arrow px-2 py-2 border-l border-border1 hover:bg-surface2" data-chip="gainers" aria-label="Choose a coin">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9aa0a6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
          </div>
          <div class="chip-group flex items-stretch rounded-2xl bg-surface border border-border1 overflow-hidden">
            <button class="chip-main px-3.5 py-2 text-sm hover:bg-surface2" data-chip="risk">ETH Risk Analysis ⚡</button>
            <button class="chip-arrow px-2 py-2 border-l border-border1 hover:bg-surface2" data-chip="risk" aria-label="Choose a coin">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9aa0a6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
          </div>
          <div class="chip-group flex items-stretch rounded-2xl bg-surface border border-border1 overflow-hidden">
            <button class="chip-main px-3.5 py-2 text-sm hover:bg-surface2" data-chip="vs">Bitcoin vs Ethereum ⚔️</button>
            <button class="chip-arrow px-2 py-2 border-l border-border1 hover:bg-surface2" data-chip="vs" aria-label="Choose a coin">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9aa0a6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
          </div>
        </div>
      </div>
      <!-- Message list -->
      <div id="messages" class="hidden max-w-2xl mx-auto w-full py-4 space-y-4"></div>
    </main>

    <!-- ===== Input Bar ===== -->
    <footer class="px-3 pt-1 pb-3 bg-base/95 backdrop-blur">
      <!-- Image preview -->
      <div id="imgPreview" class="hidden max-w-2xl mx-auto mb-2 flex items-center gap-2 px-1">
        <div class="relative inline-block">
          <img id="imgPreviewThumb" class="w-14 h-14 rounded-xl object-cover border border-border1" alt="preview" />
          <button id="imgRemove" class="absolute -top-1.5 -right-1.5 bg-[#333] border border-border1 rounded-full w-5 h-5 flex items-center justify-center" aria-label="Remove image">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <span class="text-xs text-[#9aa0a6]">Image attached</span>
      </div>

      <div class="max-w-2xl mx-auto flex items-end gap-2 bg-surface border border-border1 rounded-[26px] px-2 py-1.5">
        <button id="attachBtn" class="shrink-0 p-2 rounded-full hover:bg-surface2 active:scale-95 transition" aria-label="Attach image">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c9c9c9" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <input id="fileInput" type="file" accept="image/*" class="hidden" />
        <textarea id="input" rows="1" placeholder="Ask Chat Crypto…" class="flex-1 bg-transparent outline-none resize-none max-h-32 py-1.5 text-[15px] placeholder-[#7a7a7a] no-scrollbar"></textarea>
        <button id="micBtn" class="shrink-0 p-2 rounded-full hover:bg-surface2 active:scale-95 transition" aria-label="Voice input">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#c9c9c9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/></svg>
        </button>
        <button id="sendBtn" class="shrink-0 w-9 h-9 rounded-full flex items-center justify-center transition active:scale-95" style="background:#6C63FF" aria-label="Send">
          <svg id="sendIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z"/></svg>
          <svg id="stopIcon" class="hidden" width="16" height="16" viewBox="0 0 24 24" fill="#fff"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
      </div>
      <p id="listenLabel" class="hidden text-center text-xs text-[#ef4444] mt-1.5 font-medium">● Listening…</p>
    </footer>
  </div>

  <!-- ===== Sidebar ===== -->
  <div id="overlay" class="overlay fixed inset-0 bg-black/50 z-30"></div>
  <aside id="sidebar" class="sidebar fixed top-0 left-0 h-full w-[82%] max-w-[330px] bg-[#111111] z-40 flex flex-col border-r border-border1">
    <div class="flex items-center justify-between px-4 py-3.5 border-b border-border1/60">
      <div class="flex items-center gap-2">
        <div class="logo-mark small" style="width:24px;height:24px">
          <div class="logo-ring"></div>
          <img class="logo-img" alt="Chat Crypto">
        </div>
        <span class="text-lg font-semibold">Chat Crypto</span>
      </div>
      <button id="closeSidebar" class="p-2 rounded-full hover:bg-surface active:scale-95 transition" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#e8e8e8" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="px-3 py-3 space-y-1">
      <button id="sbNewChat" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-surface transition text-left">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#e8e8e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <span class="text-[15px]">New chat</span>
      </button>
      <div class="flex items-center gap-3 px-3 py-2 rounded-xl bg-surface border border-border1">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="searchInput" placeholder="Search chats" class="flex-1 bg-transparent outline-none text-sm placeholder-[#7a7a7a]" />
      </div>
    </div>

    <div class="px-4 pt-2 pb-1 text-xs uppercase tracking-wide text-[#7a7a7a]">Recent</div>
    <div id="recentList" class="flex-1 overflow-y-auto px-2 pb-3 space-y-0.5"></div>

    <div class="px-4 py-3 border-t border-border1/60 text-xs text-[#6a6a6a]">Chat Crypto · v1.0 · by Artur</div>
  </aside>

  <!-- ===== Coin picker (bottom sheet) ===== -->
  <div id="coinOverlay" class="overlay fixed inset-0 bg-black/60 z-40"></div>
  <div id="coinSheet" class="sheet fixed left-0 right-0 bottom-0 z-50 bg-[#111111] border-t border-border1 rounded-t-2xl max-h-[75vh] flex flex-col">
    <div class="w-9 h-1 bg-[#333] rounded-full mx-auto mt-2.5"></div>
    <div class="px-4 pt-3 pb-2">
      <h2 id="coinSheetTitle" class="text-[15px] font-semibold mb-2.5">Choose a coin</h2>
      <div class="flex items-center gap-3 px-3 py-2 rounded-xl bg-surface border border-border1">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="coinSearch" placeholder="Search e.g. SOL, Solana…" class="flex-1 bg-transparent outline-none text-sm placeholder-[#7a7a7a]" autocomplete="off" />
      </div>
    </div>
    <div id="coinList" class="flex-1 overflow-y-auto px-2 pb-4 no-scrollbar"></div>
  </div>
