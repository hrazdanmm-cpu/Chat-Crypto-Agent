<!doctype html>
<html lang="hy">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#080b14" />
  <title>Chat Crypto Agent</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{base:'#121318',panel:'#1c1d24',panel2:'#262833',line:'#2c2e3b',brand:'#2563eb',mint:'#10b981'},fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script>
  <style>
    :root{--safe-bottom:env(safe-area-inset-bottom,0px)}*{-webkit-tap-highlight-color:transparent}html,body{height:100%;background:#121318}body{overflow:hidden}::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#2c2e3b;border-radius:9px}
    .grid-menu{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .menu-card{background:#1c1d24;border:1px solid #2a2c3a;border-radius:12px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:all 0.2s}
    .menu-card:hover{background:#252734;border-color:#3b3e52}
    .menu-card svg{width:26px;height:26px}
    .bot-bubble{border-radius:6px 16px 16px 16px;background:#1c1d24;border:1px solid #2c2e3b}
    .user-bubble{border-radius:16px 6px 16px 16px;background:#2563eb}
  </style>
</head>
<body class="bg-base text-slate-100 antialiased">
  <div id="app" class="h-[100dvh] flex flex-col justify-between overflow-hidden">
    
    <!-- Header -->
    <header class="flex h-14 shrink-0 items-center justify-between border-b border-line bg-base px-4">
      <h1 class="font-bold text-lg">Crypto Agent Chat</h1>
      <button id="moreBtn" class="text-slate-300 text-xl font-bold">⋮</button>
    </header>

    <!-- Main Scroll Area -->
    <main id="scrollArea" class="flex-1 overflow-y-auto p-4">
      
      <!-- 6 Grid Menu Buttons -->
      <div id="gridMenu" class="grid-menu mb-6">
        <button class="menu-card" onclick="sendPrompt('Analyze Token')">
          <svg fill="none" stroke="#60a5fa" viewBox="0 0 24 24" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><path stroke-linecap="round" d="m21 21-4.35-4.35"></path></svg>
          <span class="text-xs font-medium text-slate-200">Analyze Token</span>
        </button>

        <button class="menu-card" onclick="sendPrompt('Market Trends')">
          <svg fill="none" stroke="#38bdf8" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
          <span class="text-xs font-medium text-slate-200">Market Trends</span>
        </button>

        <button class="menu-card" onclick="sendPrompt('News Feed')">
          <svg fill="none" stroke="#94a3b8" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2"></path></svg>
          <span class="text-xs font-medium text-slate-200">News Feed</span>
        </button>

        <button class="menu-card" onclick="sendPrompt('Portfolio Tracker')">
          <svg fill="none" stroke="#fbbf24" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"></path></svg>
          <span class="text-xs font-medium text-slate-200">Portfolio Tracker</span>
        </button>

        <button class="menu-card" onclick="sendPrompt('AI Chatbot')">
          <svg fill="none" stroke="#818cf8" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
          <span class="text-xs font-medium text-slate-200">AI Chatbot</span>
        </button>

        <button class="menu-card" onclick="sendPrompt('Alerts & Signals')">
          <svg fill="none" stroke="#f59e0b" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
          <span class="text-xs font-medium text-slate-200">Alerts & Signals</span>
        </button>
      </div>

      <!-- Chat Container -->
      <div id="chat" class="flex flex-col gap-3"></div>
    </main>

    <!-- Footer Input Bar -->
    <footer class="border-t border-line bg-base p-3" style="padding-bottom: max(12px, var(--safe-bottom));">
      <div class="flex items-center gap-2">
        <input id="input" type="text" placeholder="Գրեք հարցը..." class="flex-1 rounded-xl border border-line bg-panel px-4 py-2.5 text-sm outline-none placeholder:text-slate-500 focus:border-brand" />
        <button id="sendBtn" class="rounded-xl bg-mint px-4 py-2.5 font-semibold text-sm text-slate-950 transition hover:brightness-110">Ուղարկել</button>
      </div>
    </footer>
  </div>

<script>
(() => {
  'use strict';
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');

  function addMessage(role, text) {
    const msg = document.createElement('div');
    msg.className = role === 'user' 
      ? 'user-bubble ml-auto max-w-[85%] px-3.5 py-2 text-sm text-white' 
      : 'bot-bubble mr-auto max-w-[85%] px-3.5 py-2 text-sm text-slate-200';
    msg.textContent = text;
    chat.appendChild(msg);
    msg.scrollIntoView({ behavior: 'smooth' });
  }

  async function handleSend(text) {
    const q = text || input.value.trim();
    if (!q) return;

    addMessage('user', q);
    if (!text) input.value = '';

    const botMsg = document.createElement('div');
    botMsg.className = 'bot-bubble mr-auto max-w-[85%] px-3.5 py-2 text-sm text-slate-400';
    botMsg.textContent = 'Մշակվում է...';
    chat.appendChild(botMsg);
    botMsg.scrollIntoView({ behavior: 'smooth' });

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: q })
      });
      const data = await res.json();
      botMsg.className = 'bot-bubble mr-auto max-w-[85%] px-3.5 py-2 text-sm text-slate-200';
      botMsg.textContent = data.reply || data.text || 'Պատասխան չկա';
    } catch (e) {
      botMsg.textContent = 'Սերվերի սխալ: Ստուգեք կապը';
    }
  }

  window.sendPrompt = (txt) => handleSend(txt);
  sendBtn.onclick = () => handleSend();
  input.onkeydown = (e) => { if (e.key === 'Enter') handleSend(); };

  if (window.Telegram?.WebApp) {
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
  }
})();
</script>
</body>
</html>
