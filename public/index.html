<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Crypto</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-bg text-text antialiased h-screen overflow-hidden flex">

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar absolute inset-y-0 left-0 z-40 w-72 flex flex-col border-r border-panel bg-sidebar transform -translate-x-full transition-transform duration-200 ease-in-out md:relative md:translate-x-0">
        <div class="flex items-center justify-between p-3 border-b border-panel">
            <div class="flex items-center gap-3 px-2 py-3">
                <div class="logo h-9 w-9">
                    <img class="logo-image" src="assets/chat-crypto-logo.png" alt="Chat Crypto logo">
                </div>
                <div>
                    <strong class="block text-sm font-semibold">Chat Crypto</strong>
                    <span class="text-xs text-muted" data-t="appName">Crypto AI Assistant</span>
                </div>
            </div>
            <button id="closeSidebar" class="rounded-lg p-2 hover:bg-panel md:hidden" aria-label="Close menu">✕</button>
        </div>
        <div class="p-3">
            <button id="newChat" class="w-full flex items-center justify-center gap-2 bg-primary hover:bg-primary-hover text-white rounded-xl py-2.5 px-4 font-medium transition shadow-sm">
                <span>+</span> <span data-t="newChat">New Chat</span>
            </button>
        </div>
        <div id="historyList" class="flex-1 overflow-y-auto px-3 py-2 space-y-1">
            <!-- Chat history items will be injected here -->
        </div>
        <div class="p-3 border-t border-panel flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-2 h-2 rounded-full bg-green-500"></div>
                <span id="botStatus" class="text-xs text-muted" data-t="botOnline">Bot Online</span>
            </div>
            <button id="settingsBtn" class="rounded-lg p-2 hover:bg-panel text-muted hover:text-text transition" aria-label="Settings">⚙️</button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col min-w-0 bg-bg">
        <!-- Header -->
        <header class="flex items-center justify-between px-4 h-14 border-b border-panel bg-panel/50 backdrop-blur">
            <div class="flex items-center gap-3">
                <button id="menu" class="rounded-lg p-2 hover:bg-panel md:hidden" aria-label="Menu">☰</button>
                <div class="logo h-8 w-8 md:hidden">
                    <img class="logo-image" src="assets/chat-crypto-logo.png" alt="Chat Crypto logo">
                </div>
                <h1 id="currentChatTitle" class="text-sm font-medium truncate">Chat Crypto</h1>
            </div>
            <div class="flex items-center gap-2">
                <select id="langSelect" class="bg-panel border border-border rounded-lg px-2 py-1 text-xs text-text focus:outline-none focus:border-primary">
                    <option value="en">English</option>
                    <option value="ru">Русский</option>
                    <option value="hy">Հայերեն</option>
                </select>
                <button id="themeToggle" class="rounded-lg p-2 hover:bg-panel text-muted hover:text-text transition" aria-label="Toggle theme">🌙</button>
            </div>
        </header>

        <!-- Chat Scroll Area -->
        <main id="scrollArea" class="no-scrollbar flex-1 overflow-y-auto">
            <div id="chat" class="mx-auto flex min-h-full w-full max-w-3xl flex-col gap-5 px-4 py-7 md:px-7">
                <section id="welcome" class="m-auto text-center">
                    <div class="logo mx-auto mb-7 h-16 w-16 max-w-[26vw] max-h-[26vw]">
                        <img class="logo-image" src="assets/chat-crypto-logo.png" alt="Chat Crypto logo">
                    </div>
                    <h2 class="text-3xl font-bold tracking-tight" data-t="welcomeTitle">Welcome to Chat Crypto</h2>
                    <p class="mt-2 text-muted max-w-md mx-auto" data-t="welcomeDesc">Your smart assistant for cryptocurrency markets, risk calculation, and technical trading analysis.</p>
                </section>
            </div>
        </main>

        <!-- Input Footer -->
        <footer class="p-4 border-t border-panel bg-panel/30">
            <form id="chatForm" class="max-w-3xl mx-auto flex items-end gap-2 bg-panel border border-border rounded-2xl p-2 shadow-inner focus-within:border-primary transition">
                <textarea id="userInput" rows="1" class="flex-1 bg-transparent border-0 focus:ring-0 text-text placeholder-muted resize-none max-h-32 px-3 py-1.5 text-sm focus:outline-none" placeholder="Ask about crypto, prices, or risk management..." data-t-placeholder="inputPlaceholder"></textarea>
                <button type="submit" id="sendBtn" class="bg-primary hover:bg-primary-hover text-white rounded-xl p-2.5 transition flex items-center justify-center shadow-sm disabled:opacity-50">
                    <svg class="w-4 h-4 transform rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                </button>
            </form>
        </footer>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-sidebar border border-panel rounded-2xl w-full max-w-md p-6 shadow-2xl">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-bold" data-t="settingsTitle">Settings</h3>
                <button id="closeSettings" class="rounded-lg p-1.5 hover:bg-panel text-muted hover:text-text">✕</button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-muted mb-1" data-t="apiKeyLabel">API Key / Webhook URL</label>
                    <input type="password" id="apiKeyInput" class="w-full bg-panel border border-border rounded-xl px-3 py-2 text-sm text-text focus:outline-none focus:border-primary" placeholder="Enter custom endpoint...">
                </div>
            </div>
            <div class="mt-6 flex justify-end gap-2">
                <button id="saveSettings" class="bg-primary hover:bg-primary-hover text-white px-4 py-2 rounded-xl text-sm font-medium transition" data-t="saveBtn">Save</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
